---
layout: default
header_color: '#33cc66'
title: Tags
permalink: /tags/
---
<article class="post">
    <header class="post-header">
        <h1 class="post-title">{{ page.title | escape }}</h1>
    </header>

    <div class="post-content">
        <h4>Main Tags</h4>
        <ul class="tag-list">
            {% for tag in site.post_tags %}
            <li>
                <a href="{{tag.url | relative_url}}">{{tag.title}}</a>     
            </li>
            {% endfor %}
        </ul>
    </div>
</article>
