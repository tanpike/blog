---
layout: default
header_color: '#33cc66'
title: Tags
permalink: /tags/
---
<article class="post">
    <header class="post-header">
        <h1 class="post-title">{{ page.title | escape }}</h1>
    </header>

    <div class="post-content">
        <h4>Main Tags</h4>
        <ul class="tag-list">
            {% for tag in site.post_tags %}
            <li>
                <a href="/blog/{{tag.url}}">{{tag.title}}</a>        
            </li>
            {% endfor %}
        </ul>

        <script>
    
            $(document).ready(function () {
    
                var tags = [];
                {% for tag in site.tags %}
                    {% assign tag_slug = tag[0] | sluggify %}                    
                    {% assign weight = site.tags[tag_slug] | size %}
                    {% assign title = tag[0] %}
                    tags.push({
                        text: "{{ title }}",
                        weight: '{{ weight }}',
                        link: '{% include tag_url tag=title %}'
                    });
                {% endfor %}
    
    
                $('.wordcloud').jQCloud(tags, {
                    'shape': 'rectangular'
                });    
            });
    
        </script>

        
    </div>
</article>
